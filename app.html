.note{border-left:3px solid var(--accent);padding:10px 14px;background:var(--surface);border-radius:0 9px 9px 0;font-size:.9rem}
.inbox .ii{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.flash{animation:fl 1.2s ease}
@keyframes fl{0%{box-shadow:0 0 0 0 var(--accent)}30%{box-shadow:0 0 0 4px var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px){

  .conn{display:flex;overflow-x:auto}
  .cn{white-space:nowrap}
  .side h3{display:none}
  .top{padding:12px 16px;position:static}
  .view{padding:18px 16px}
  .split,.gosplit{grid-template-columns:1fr}
}

<script>
(function(){
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STORE = "linksharp.demo.b2b.v2";

/* ---------- Données fictives ---------- */
const PROS = [
  {id:"lumen", co:"Atelier Lumen", sec:"Usinage", city:"Lille", who:"Claire Morel", role:"directrice générale", first:"Claire", sig:"3 postes de technicien ouverts", age:"6 sem.", src:"Offre en ligne, vérifiée à 17:32", ok:true, phone:"06 •• •• •• 41", hot:true,
   mail:"Bonjour Claire,\n\nVous avez ouvert 3 postes de technicien de maintenance en septembre, et ils sont toujours en ligne.\n\nNous aidons des sites industriels comme le vôtre à tenir leurs plannings pendant ces recrutements.\n\n15 minutes jeudi à 10h ou vendredi à 14h ?\n\nSi ce n'est pas un sujet pour vous, dites-le-moi et je ne vous écrirai plus.", subj:"Vos 3 postes de technicien"},
  {id:"nordvia", co:"Nordvia Logistique", sec:"Transport", city:"Arras", who:"Marc Delmotte", role:"directeur des opérations", first:"Marc", sig:"Nouvel entrepôt annoncé", age:"il y a 12 j", src:"Communiqué, vérifié à 17:34", ok:true, phone:"03 •• •• •• 18",
   mail:"Bonjour Marc,\n\nVous avez annoncé l'ouverture de votre entrepôt d'Arras il y a deux semaines.\n\nNous aidons les logisticiens à démarrer un nouveau site sans retard sur les premiers mois.\n\n15 minutes mardi à 11h ou mercredi à 15h ?\n\nSi ce n'est pas un sujet pour vous, dites-le-moi et je ne vous écrirai plus.", subj:"Votre entrepôt d'Arras"},
  {id:"kerfi", co:"Kerfi Solutions", sec:"Logiciel", city:"Lyon", sig:"Levée de 4 M€", age:"juin", ok:false, why:"Décideur non confirmé"},

   mail:"Bonjour Paul,\n\nFélicitations pour votre arrivée à la direction commerciale d'Ondine Énergie il y a trois semaines.\n\nNous aidons les équipes commerciales qui se structurent à remplir leur agenda dès le premier trimestre.\n\n15 minutes jeudi à 9h30 ou vendredi à 11h ?\n\nSi ce n'est pas un sujet pour vous, dites-le-moi et je ne vous écrirai plus.", subj:"Votre arrivée chez Ondine"},
  {id:"brevan", co:"Brévan Conseil", sec:"Conseil RH", city:"Paris", sig:"Offre « chargé d'affaires »", age:"en ligne", ok:false, why:"Déjà dans « À ne pas contacter »"},
  {id:"ferrand", co:"Maison Ferrand", sec:"Agroalimentaire", city:"Amiens", who:"Inès Ferrand", role:"présidente", first:"Inès", sig:"Ouverture d'une 2e usine", age:"21 j", src:"Communiqué, vérifié à 17:42", ok:true, phone:"03 •• •• •• 07", emailWarn:true,

  {id:"talvo", co:"Talvo Industrie", sec:"Mécanique", city:"Valenciennes", sig:"Poste de directeur d'usine", age:"retiré", ok:false, why:"Offre retirée : signal expiré"},

];
const RELANCES = [
  {co:"Corvo Bâtiment", type:"J+3", late:0}, {co:"Pelia Santé", type:"J+7", late:0}, {co:"Brix Emballage", type:"J+3", late:3},
  {co:"Oméa Conseil", type:"J+3", late:0}, {co:"Atelier Sorel", type:"J+7", late:1}, {co:"Hexa Froid", type:"J+3", late:0}
];
const CONN = [
  {id:"sheets", ic:"S", n:"Google Sheets", role:"Votre fichier de suivi : prospects, statuts, rapport.", where:"Dans votre Google Drive."},
  {id:"gmail", ic:"M", n:"Gmail", role:"Lit les réponses et programme vos envois aux heures prévues.", where:"Dans votre boîte. Aucun mail ne passe par LinkSharp."},
  {id:"cal", ic:"A", n:"Google Agenda", role:"Bloque vos créneaux d'appels et ajoute les rendez-vous.", where:"Dans votre agenda."},
  {id:"crm", ic:"C", n:"CRM (HubSpot…)", role:"Facultatif : fiches et historique synchronisés.", where:"Dans votre CRM."},

  {id:"ai", ic:"IA", n:"Votre IA", role:"Recherche les signaux et rédige les messages.", where:"Claude, ChatGPT ou autre, avec votre abonnement."}
];
const STEPS = [
  {id:"search", t:"17:30", n:"Recherche"}, {id:"checks", t:"17:44", n:"Contrôles"}, {id:"msgs", t:"17:51", n:"Messages"},
  {id:"go", t:"21:00", n:"Go"}, {id:"brief", t:"07:15", n:"Brief"}, {id:"replies", t:"13:10", n:"Réponses"}, {id:"rdv", t:"Semaine", n:"RDV"}
];

/* ---------- État ---------- */
const fresh = () => ({step:"search", conn:{}, edits:{}, sel:"lumen", filter:"all", go:false, goAt:null, include:{}, reply:false, rdv:false});
let S;
function restoreState(raw){
  const clean=fresh();
  try {
    const saved=JSON.parse(raw || "{}");
    if(!saved || typeof saved !== "object" || Array.isArray(saved)) return clean;
    if(STEPS.some(step=>step.id===saved.step)) clean.step=saved.step;
    if(PROS.some(p=>p.id===saved.sel && p.ok)) clean.sel=saved.sel;
    if(["all","ok","out"].includes(saved.filter)) clean.filter=saved.filter;
    const record=value=>value && typeof value==="object" && !Array.isArray(value);
    if(record(saved.conn)) CONN.forEach(c=>clean.conn[c.id]=saved.conn[c.id]===true);
    if(record(saved.include)) PROS.forEach(p=>{ if(typeof saved.include[p.id]==="boolean") clean.include[p.id]=saved.include[p.id]; });
    if(record(saved.edits)) PROS.forEach(p=>{ if(typeof saved.edits[p.id]==="string") clean.edits[p.id]=saved.edits[p.id]; });
    clean.go=saved.go===true && clean.conn.gmail===true && clean.conn.sheets===true;
    clean.goAt=clean.go && typeof saved.goAt==="string" ? saved.goAt : null;
    clean.reply=clean.go && clean.conn.cal===true && clean.include.lumen!==false && saved.reply===true;
    clean.rdv=clean.reply && saved.rdv===true;
    return clean;
  } catch(e) { return clean; }
}

const save = () => { try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} };
const kept = () => PROS.filter(p => p.ok);
const inc = id => S.include[id] !== false && !PROS.find(p => p.id === id)?.emailWarn;
const mailOf = p => S.edits[p.id] != null ? S.edits[p.id] : p.mail;
const words = t => (t.trim().match(/\S+/g)||[]).length;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("on"),3200); }

/* ---------- Calcul de volume (même règle que le skill : J0 protégés, relances en retard de 3 j prioritaires) ---------- */
function volume(){
  const cap = 30, already = 0, place = cap - already;
  const prio = RELANCES.filter(r => r.late >= 3);
  const j0 = kept().filter(p => inc(p.id));
  const room = Math.max(0, place - prio.length - j0.length);
  const others = RELANCES.filter(r => r.late < 3).sort((a,b) => b.late - a.late);
  const relIn = others.slice(0, room), relOut = others.slice(room);
  return {cap, already, place, prio, j0, relIn, relOut, total: already + prio.length + j0.length + relIn.length};
}
function schedule(){
  const v = volume(), out = []; let m = 8*60+30;
  v.j0.forEach(p => { out.push({h:m, label:p.co, kind:"J0", id:p.id}); m += 2; });
  let r = 14*60; [...v.prio, ...v.relIn].forEach(x => { out.push({h:r, label:"Relance "+x.type+" · "+x.co, kind:"rel", late:x.late}); r += 2; });
  return out;
}
const hm = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");

/* ---------- Barre latérale ---------- */
function renderSide(){
  $("steps").innerHTML = STEPS.map(s => {
    const done = (s.id==="go"&&S.go)||(s.id==="replies"&&S.reply)||(s.id==="rdv"&&S.rdv);
    return `<button class="step ${S.step===s.id?"on":""}" data-step="${s.id}"><span class="t">${s.t}</span><span>${s.n}</span><span class="dot ${done?"ok":""}"></span></button>`; }).join("");
  $("conn").innerHTML = CONN.map(c => `<button class="cn ${S.conn[c.id]?"on":""}" data-conn="${c.id}"><span class="ic">${c.ic}</span><span>${c.n}</span><span class="st">${S.conn[c.id]?"connecté":"connecter"}</span></button>`).join("");
  const st = $("goState");
  if(S.go){ st.className="chip okc"; st.textContent="Go donné · "+schedule().length+" programmés"; }
  else { st.className="chip sig"; st.textContent="En attente de votre go"; }
  $("clock").textContent = (STEPS.find(s=>s.id===S.step)||STEPS[0]).t;
}

V.go = () => {

   <div class="card vol"><div class="mono muted" style="font-size:.76rem">CALCUL DU VOLUME</div>

    <button class="primary go" id="goBtn" ${S.go?"disabled":""}>${S.go?"✓ Go donné":"go"}</button>
    ${S.go?`<div class="muted" style="font-size:.85rem">Programmés dans votre boîte à ${S.goAt}. Le contrôle de 13:10 annulera toute relance si quelqu'un répond.</div>`:""}</div>
   <div><div class="mono muted" style="font-size:.76rem;margin-bottom:8px">${S.go?"BOÎTE D'ENVOI · PROGRAMMÉS":"LOT PROPOSÉ"}</div><div class="sched">
    ${kept().map(p => { const s = sch.find(x=>x.id===p.id); return `<div class="card si ${inc(p.id)?"":"off"}"><span class="h">${s?hm(s.h):"—"}</span><label><input type="checkbox" data-inc="${p.id}" ${p.emailWarn?"disabled":""} ${inc(p.id)?"checked":""}> ${esc(p.co)}</label>${p.emailWarn?'<span class="chip sig">exclu · email non validé</span>':""}<span class="chip ${S.go&&inc(p.id)?"okc":"neu"}">${S.go&&inc(p.id)?"Programmé":"J0"}</span></div>`; }).join("")}
    ${sch.filter(x=>x.kind==="rel").map(x=>`<div class="card si"><span class="h">${hm(x.h)}</span><span style="flex:1;font-weight:600">${esc(x.label)}</span>${x.late>=3?'<span class="chip sig">prioritaire</span>':""}<span class="chip ${S.go?"okc":"neu"}">${S.go?"Programmé":"Relance"}</span></div>`).join("")}
    ${volume().relOut.map(x=>`<div class="card si off"><span class="h">demain</span><span style="flex:1;font-weight:600">Relance ${x.type} · ${esc(x.co)}</span><span class="chip sig">reportée (volume)</span></div>`).join("")}

   <p class="muted" style="margin-top:8px">Exemple du brief du 10 novembre : qui appeler, quoi dire, quoi répondre. Les réponses simulées ensuite sont signalées ci-dessous.</p></div></div>
  ${S.go?"":`<div class="note" style="margin-bottom:14px">Le brief s'appuie sur le lot validé. Donnez d'abord votre go à l'étape « Go ».</div>`}
  <div class="card brief"><div class="bh"><b>Brief mar. 10/11 – ${leads.length} leads · 3 mails · 1 meeting</b><div class="mono muted" style="font-size:.76rem">à vous-même · 07:15</div></div>

   ${leads.map((p,i)=>`<div class="lead"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="font-family:var(--f-display);font-size:1.15rem">${esc(p.co)}</b><span class="chip ${p.hot?"sig":"neu"}">${p.hot?"À appeler · besoin à confirmer":"Signal fort · 3 sem."}</span></div>

     <div><span class="chip sig">Objection</span> ${p.hot?"« On gère en interne » → proposez un seul renfort de 3 mois.":"« Trop tôt » → proposez de rappeler dans 4 semaines, à date fixe."}</div></div>`).join("")}
   <div><div class="mono muted" style="font-size:.74rem">AGENDA</div>${S.go && S.conn.cal ? "Bloc d’appels prévu à 09:30 (simulation)." : "Bloc d’appels non réservé : validez le lot et connectez Agenda."} ${S.rdv ? "Lumen : jeudi 19 novembre, 10h–10h15." : "Aucun nouveau rendez-vous confirmé dans cette simulation."}</div></div></div>`;

   <p class="muted" style="margin-top:8px">À 13:10, LinkSharp relit les réponses. Une relance n'est jamais envoyée à quelqu'un qui a répondu.</p></div>
   <button class="primary" id="simReply" ${S.reply || !S.go || !inc("lumen") || !S.conn.gmail || !S.conn.cal ? "disabled":""}>${S.reply?"✓ Réponse reçue":"Simuler une réponse"}</button></div>
  <div class="card inbox">
   ${S.reply?`<div class="ii flash"><span class="chip accc">12:47</span><div><b>Claire Morel · Atelier Lumen</b><div>« Oui, jeudi 19 novembre à 10h me va. »</div></div><span class="chip okc">Répondu</span></div>`:""}
   <div class="ii"><span class="mono">14:06</span><div style="${S.reply?"text-decoration:line-through;color:var(--muted)":""}"><b>Relance J+3 · Atelier Lumen</b></div><span class="chip ${S.reply?"badc":"neu"}">${S.reply?"Annulée · a répondu":S.go&&inc("lumen")?"Programmée (simulation J+3)":"Non programmée"}</span></div>
   ${["Corvo Bâtiment","Pelia Santé","Oméa Conseil"].map((c,i)=>`<div class="ii"><span class="mono">14:${String(i*2).padStart(2,"0")}</span><div><b>Relance · ${c}</b></div><span class="chip okc">${S.go?"Programmée":"En attente du go"}</span></div>`).join("")}
  </div>
  ${S.reply?`<div class="note" style="margin-top:14px">Claire a proposé jeudi 19 novembre à 10h : le rendez-vous est ajouté à l'agenda de la personne qui tient l'échange. Voir l'étape « RDV ».</div>`:""}`;
V.rdv = () => {
  const days = ["Lun. 16","Mar. 17","Mer. 18","Jeu. 19","Ven. 20"], hours = [9,10,11,12,13,14,15,16,17];
  const ev = [];
  if(S.go && S.conn.cal) [0,1,2,3,4].forEach(d => ev.push({d, h:9.5, len:.5, cls:"call", t:"Appels LinkSharp · 30 min"}));
  ev.push({d:1, h:15.5, len:1, cls:"rdv", t:"RDV existant · Nordvia Logistique"});
  if(S.rdv) ev.push({d:3, h:10, len:.25, cls:"rdv", t:"RDV · Atelier Lumen"});
  const n = S.rdv ? 1 : 0;
  let g = `<div class="cg"><div></div>${days.map(d=>`<div class="dh ${d.includes("férié")?"muted":""}">${d}</div>`).join("")}`;
  hours.forEach(h => { g += `<div class="hr">${h}h</div>`; days.forEach((d,i) => {
    const here = ev.filter(e => e.d===i && Math.floor(e.h)===h);
    g += `<div class="cell ${d.includes("férié")?"hol":""}">${here.map(e=>`<div class="ev ${e.cls} ${e.cls==="rdv"&&e.d===3?"flash":""}" style="top:${(e.h-h)*44+2}px;height:${e.len*44-4}px">${esc(e.t)}</div>`).join("")}</div>`; }); });
  g += `</div>`;
  return `<div class="head"><div><div class="eyebrow">Le résultat</div><h1>Des rendez-vous dans votre agenda.</h1>
   <p class="muted" style="margin-top:8px">Un créneau d'appels réservé chaque matin, les rendez-vous ajoutés quand un prospect accepte. Le scénario a exclu le 11 novembre ; cette vue montre la semaine suivante.</p></div>
   <div class="card stat" style="margin-left:auto"><span class="muted">Cette semaine</span><b style="color:var(--accent)">+${n}</b><span class="muted" style="font-size:.8rem">nouveau rendez-vous (simulation)</span></div></div>
  ${S.reply?"":`<div class="note" style="margin-bottom:14px">Astuce : simulez une réponse à l'étape « Réponses » pour voir le rendez-vous s'ajouter.</div>`}
  <div class="card cal">${g}</div>`;
};

function render(){
  renderSide();
  $("view").innerHTML = V[S.step]();
  save();
  const ta = $("mailTxt");
  if(ta) ta.addEventListener("input", () => {
    const p = kept().find(x=>x.id===S.sel) || kept()[0];
    S.edits[p.id] = ta.value;
    if(S.go){ S.go = false; S.goAt = null; S.reply = false; S.rdv = false; toast("Message modifié après le go : un nouveau go est nécessaire."); renderSide(); if($("mailState")){ $("mailState").textContent="En attente d’un nouveau go"; $("mailState").className="chip sig"; } }
    const t = ta.value, n = words(t);
    const r = [["Fait daté", /\b(il y a|septembre|mois|semaines?|ouvert|annonc)/i.test(t)],["Une seule demande", (t.match(/\?/g)||[]).length===1],["Droit de dire stop", t.includes("je ne vous écrirai plus")],["Moins de 120 mots", n<120]];
    $("rules").innerHTML = r.map(x=>`<span class="chip ${x[1]?"okc":"badc"}">${x[1]?"✓":"✕"} ${x[0]}</span>`).join("")+`<span class="chip neu" style="margin-left:auto">${n} mots</span>`;
    save();
  });
}

/* ---------- Connecteurs (simulés) ---------- */
function openConn(id){
  const c = CONN.find(x=>x.id===id), on = !!S.conn[id];
  $("modalRoot").innerHTML = `<div class="modal" id="mdl" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="card">
   <div class="eyebrow">Connecteur · démo</div><h2 id="mt">${esc(c.n)}</h2>
   <div>${esc(c.role)}</div>
   <div class="note"><b>Où restent vos données :</b> ${esc(c.where)}</div>
   <div class="muted" style="font-size:.86rem">Dans la démo, la connexion est simulée. Dans la version réelle, vous autorisez l'accès depuis votre propre compte, et vous pouvez le retirer à tout moment.</div>
   <div style="display:flex;gap:8px;justify-content:flex-end"><button id="mClose">Fermer</button><button class="primary" id="mOk">${on?"Déconnecter":"Connecter (démo)"}</button></div></div></div>`;
  const close = () => { $("modalRoot").innerHTML = ""; };
  $("mClose").onclick = close; $("mdl").onclick = e => { if(e.target.id==="mdl") close(); };
  $("mOk").onclick = () => { S.conn[id] = !on; if(on && ["sheets","gmail","cal"].includes(id)){ S.go=false; S.goAt=null; S.reply=false; S.rdv=false; } close(); render(); toast(on ? c.n+" déconnecté (démo)." : c.n+" connecté (démo)."); };
  $("mOk").focus();
}

/* ---------- Événements ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button, input"); if(!b) return;
  if(b.dataset.step){ S.step = b.dataset.step; render(); window.scrollTo({top:0}); return; }
  if(b.dataset.conn){ openConn(b.dataset.conn); return; }
  if(b.dataset.filter){ S.filter = b.dataset.filter; render(); return; }
  if(b.dataset.sel){ S.sel = b.dataset.sel; render(); return; }
  if(b.dataset.inc){ S.include[b.dataset.inc] = b.checked; if(S.go){ S.go=false; S.goAt=null; S.reply=false; S.rdv=false; toast("Lot corrigé après le go : un nouveau go est nécessaire."); } render(); return; }
  if(b.id === "goBtn"){
    const missing = ["sheets","gmail"].filter(k => !S.conn[k]);
    if(missing.length){ toast("Connectez d'abord Google Sheets et Gmail (barre de gauche)."); return; }
    const invalid = volume().j0.some(p => { const t=mailOf(p); return !t.trim() || words(t)>=120 || (t.match(/\?/g)||[]).length!==1 || !t.includes("je ne vous écrirai plus"); });
    if(invalid){ toast("Corrigez les messages : une question, moins de 120 mots et la phrase d’opposition sont nécessaires."); return; }
    S.go = true; S.goAt = "21:04"; render(); toast(schedule().length+" mails programmés. Ferrand est exclu : email non validé."); return; }
  if(b.id === "simReply"){
    if(!S.go || !inc("lumen") || !S.conn.gmail || !S.conn.cal){ toast("Validez un lot incluant Lumen et connectez Gmail et Agenda avant cette simulation."); return; }
    S.reply = true; S.rdv = true; render(); toast("Réponse de Claire : relance de J+3 à 14:06 annulée, rendez-vous ajouté jeudi 19 novembre à 10h."); return; }
  if(b.id === "reset"){ S = fresh(); render(); toast("Démo remise à zéro."); return; }
});
document.addEventListener("keydown", e => { if(e.key==="Escape") $("modalRoot").innerHTML = ""; });
render();
})();
</script>
